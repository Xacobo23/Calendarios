<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <title>Registro</title>
</head>

<body>
    <header>
        <img src="{% static 'images/logo.png' %}" alt="Imagen logo IES San Clemente" class="logo">
    </header>
    <main>
        <div class="login-container">
            <div class="alumno-container">
                <div class="smallTriangleWhite"> </div>
                <img src="{% static 'images/home/alumno.png' %}" alt="Estudiante feliz" class="alumno">
            </div>
            <div class="form-container">
                <h2 class="loginText">Registro</h2>
                <form action="{% url 'register' %}" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="text" id="username" name="username" placeholder="Usuario (Email)"
                            value="{{ form.username.value }}" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Correo Electrónico"
                            value="{{ form.email.value }}" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="first_name" name="first_name" placeholder="Nombre"
                            value="{{ form.first_name.value }}" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="last_name" name="last_name" placeholder="Apellidos"
                            value="{{ form.last_name.value }}" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="phone_number" name="phone_number" placeholder="Teléfono"
                            value="{{ form.phone_number.value }}">
                    </div>
                    <div class="form-group">
                        <input type="password" id="password1" name="password1" placeholder="Contraseña" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password2" name="password2" placeholder="Confirmar Contraseña"
                            required>
                    </div>
                    <button type="submit" class="btn">Registrarse</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
