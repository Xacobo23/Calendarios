<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    {% load static %}
    
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <title>Registro</title>
</head>

<body>
    <header>
        <img src="{% static 'images/logo.png' %}" alt="Imagen logo IES San Clemente" class="logo">
    </header>
    <main>
        <div class="login-container">
            <div class="alumno-container">
                <div class="smallTriangleWhite"> </div>
                <img src="{% static 'images/home/alumno.png' %}" alt="Estudiante feliz" class="alumno">
            </div>
            <div class="form-container">
                <h2 class="loginText">Registro</h2>
                <form action="{% url 'register' %}" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Nombre de usuario: </label>
                        {{ form.username }}
                    </div>
                    <div class="form-group">
                        <label for="email">Email: </label>
                        {{ form.email }}
                    </div>
                    <div class="form-group">
                        <label for="password1">Contraseña: </label>
                        {{ form.password1 }}
                    </div>
                    <div class="form-group">
                        <label for="password2">Repite la contraseña: </label>
                        {{ form.password2 }}
                    </div>
                    <div class="form-group">
                        <label for="first_name">Nombre: </label>
                        {{ form.first_name }}
                    </div>
                    <div class="form-group">
                        <label for="last_name">Apellidos: </label>
                        {{ form.last_name }}
                    </div>
                    <div class="form-group">
                        <label for="dni">DNI: </label>
                        {{ form.dni }}
                    </div>
                    <div class="form-group">
                        <label for="phone">Teléfono: </label>
                        {{ form.phone }}
                    </div>
                    <button type="submit" class="btn-register">Registrar</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
