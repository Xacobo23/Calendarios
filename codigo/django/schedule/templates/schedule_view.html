{% extends 'base.html' %}

{% block title %} {{ title }} {% endblock %}

{% block css %} 
<style>
    .schedule-section {
        display: flex;
        flex-direction: column;
        gap: 1em;
    }

    .item-title {
        display: flex;
        justify-content: start;
        align-items: center;
        gap: 1em;

        color: #468DAE;

        border-bottom: 1px solid rgba(0, 0, 0, .1);
    }

    .item-title i {
        font-size: 1.5em;
    }

    .item-title h2 {
        font-weight: bold;
    }

    .display-id {
        display: flex;
        gap: 1em;
        flex-direction: row;
    }

    .item-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding-top: 1em;

        margin-bottom: 1em;
        margin-right: 1em;
    }

    .btn {
        color: white;

        padding: 1em 4em;

        border: none;
        border-radius: .5em;

        cursor: pointer;
    }

    .btn:hover {
        opacity: .8;
    }

    .btn-save {
        background-color: #468DAE;
    }

    .btn-export {
        background-color: #F26B1D;
    }

    .table {
        display: table;
        
        width: calc(100% - 1em);

        border-collapse: collapse;

        margin: 1em 0em;
        margin-right: 1em;
    }

    .table-row {
        display: table-row;
    }

    .table-header {
        display: table-cell;

        text-align: center;

        padding: 1em;
        border: 1em;

        background-color: #468DAE;
        color: white;
    }

    .table-cell {
        display: table-cell;

        text-align: center;
    }

    .table-cell select {
        width: 100%;

        padding: 2em;

        border: none;

        background-color: white;
    }

    .schedule-table{
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    @media (max-width: 700px) {
        .schedule-table{
            padding: 1em;
        }
    }

    .selected-day{
        width: calc(100% - 2.4em);
        color: white;
        background-color: #468DAE;
        padding: 1.2em;
        margin-left: 1em;
        margin-right: 1em;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .btn-list{
        width: 100%;
        margin: 1em;
        display: flex;
        gap: 5%;
        justify-content: center;
        align-items: center;
        
    }

    .btn-list button {
        background-color: #F2F2F2;
        width: 20%;
        color: black;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
    }

    .btn-list button.active {
        color: white;
        background-color: #468dae;
    }

    .divisor{
        display: table-row;
        width: 100%;
        height: 2px;
        border-bottom: #F2F2F2 solid 1px;
    }

    @media (max-width: 700px) {

        .item-actions {
            display: flex;
            flex-direction: column;
            margin-left: 1em;
            gap: 1.2em;
        }

        .display-id{
            width: 100%;
            display: flex;
            justify-content: start;
            align-items: start;
        }

        .action-buttons{
            width: 100%;
            gap: 1em;
            display: flex;
            justify-content: space-between;
        }

        .btn-export{
            width: 100%;
            padding-top: 1em;
            padding-bottom: 1em;
        }

        .btn-save{
            width: 100%;
            padding-top: 1em;
            padding-bottom: 1em;
        }
    }

</style>
{% endblock %}

{% block content %}
<section class="schedule-section">
    <article class="item-title">
        <i class="fa-regular fa-clock"></i>
        <h2>Horario/<small>{{ fp.initials }}</small></h2>
    </article>
    <article class="item-actions">
        <div class="display-id">
            <span>Ciclo</span>
            <input type="text" value="{{ fp.initials }}" disabled>
        </div>
        <div class="action-buttons">
            <button class="btn btn-save"><i class="fa-regular fa-floppy-disk"></i> Guardar</button>
            <button class="btn btn-export"><i class="fa-regular fa-file-pdf"></i> Exportar a PDF</button>
        </div>
    </article>
    <article class="schedule-table">
    </article>
</section>

                break;

                break;
