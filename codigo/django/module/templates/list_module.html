<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Modulos</title>
</head>

<body>

    <main>

        <h1>Lista Modulos</h1>

        <ul>
            {% for module in modules %}
            <li>{{ module.name }}</li>
            {% endfor %}
        </ul>

    </main>

</body>

</html>
