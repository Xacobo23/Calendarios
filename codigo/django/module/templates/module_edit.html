{% extends 'base_manage_item.html' %}

{% block identifier %}

{{ module_code }}

{% endblock %}
{% block form %}
<article class="item-main">
    <section class="item-edit-side">
        <h2>Datos del módulo</h2>

        <form method="post" class="form-manage">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label for="{{ form.code.id_for_label }}">{{ form.code.label }}</label>
                    {{ form.code }}
                </div>

                <div class="form-group">
                    <label for="{{ form.initials.id_for_label }}">{{ form.initials.label }}</label>
                    {{ form.initials }}
                </div>
            </div>

            <div class="form-row-large">
                <div class="form-group">
                    <label for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
                    {{ form.name }}
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="{{ form.credits.id_for_label }}">{{ form.credits.label }}</label>
                    {{ form.credits }}
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="{{ form.teacher.id_for_label }}"> </label>{{ form.teacher.label }}</label>
                    {{ form.teacher }}
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="{{ form.fp.id_for_label }}">{{ form.fp.label }}</label>
                    {{ form.fp }}
                </div>
            </div>

            <button type="submit" class="btn btn-save">Guardar</button>
        </form>
    </section>
</article>
{% endblock %}
