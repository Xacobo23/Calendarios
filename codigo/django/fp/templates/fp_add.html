{% extends 'base_manage_item.html' %}
{% block form %}
<article class="item-main">
    <section class="item-edit-side">
        <h2>Datos</h2>

        <form method="post" class="form-manage">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label for="code">Código</label>
                    <input type="text" id="code" name="code" placeholder="Código">
                </div>

                <div class="form-group">
                    <label for="initials">Siglas</label>
                    <input type="text" name="initials" id="initials" placeholder="Siglas">
                </div>
            </div>
            <div class="form-row-large">
                <div class="form-group">
                    <label for="{{ form.name.id_for_label }}">{{ form.name.label}} </label>
                    {{ form.name }}
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="code">Duración (años)</label>
                    <input type="text" id="duration" name="duration" placeholder="Duración">
                </div>
                <!-- <div class="form-group">
                        <label for="code">Código</label>
                        <input type="text" id="code" name="code" placeholder="Código">
                    </div> AÑADIR MÁS CAMPOS AQUÍ -->
            </div>
            <div class="form-row-large">
                <div class="form-group">
                    <label for="{{ form.description.id_for_label}}">{{ form.description.label }}</label>
                    {{ form.description }}
                </div>
            </div>

            <button type="submit" class="btn btn-save">Guardar</button>
        </form>
    </section>
</article>
{% endblock %}
